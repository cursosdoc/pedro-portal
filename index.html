<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Radar</title>
<meta name="description" content="Daily UK job digest: matched postings, fit scores and deadlines, aggregated by day.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%232f6fde' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%232f6fde' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%232f6fde'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/all">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14"/><circle cx="16" cy="16" r="7"/><circle class="dot" cx="16" cy="16" r="2.5"/></svg>
    <span>Job Radar</span>
  </a>
  <nav class="tabs" aria-label="Views">
    <a href="#/all" data-view="all">Overview</a>
    <a href="#/latest" data-view="day">Daily digest</a>
    <a href="#/startups" data-view="startups">Startups</a>
  </nav>
  <label class="datepick">
    <span class="sr">Digest date</span>
    <select id="dateSelect" aria-label="Digest date"></select>
  </label>
  <button id="themeBtn" class="iconbtn" type="button" aria-label="Toggle theme" title="Toggle theme">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
  </button>
</header>

<div class="layout">
  <aside class="sidebar" aria-label="Digest days">
    <h2>Days</h2>
    <ol id="dayList" class="daylist"></ol>
  </aside>
  <main id="main" tabindex="-1">
    <p class="loading">Loading…</p>
  </main>
</div>

<footer class="foot">
  <span id="footNote"></span>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
